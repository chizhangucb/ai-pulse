# Render Blueprint for AI Pulse (docs/deploy.md, "On Render"): one Docker image in three roles plus Render Postgres,
# all in Oregon. The image's default command starts web, so every service names its own dockerCommand.
# Secrets are `sync: false`: Render asks for them once, when the Blueprint is first applied. Each service deploys
# only after the commit's checks pass.

envVarGroups:
  # Non-secret settings shared by the api and the worker, as in .env.example.
  - name: ai-pulse-backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: AIHOT_DATA_DIR
        value: /data
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: anthropic/claude-haiku-5.5
      - key: LLM_EXTRA_JSON
        value: '{"reasoning":{"enabled":false}}'
      - key: LLM_VISION
        value: "true"
      - key: UNDERSTAND_MODEL
        value: or-claude-sonnet
      - key: FEISHU_CONTENT_PUSH_ENABLED
        value: "false"
      - key: FEISHU_INTERNAL_ENABLED
        value: "false"
      - key: INDEXNOW_SUBMIT_ENABLED
        value: "false"
      - key: COLLECT_ENABLED
        value: "true"
      - key: MODEL_CALLS_ENABLED
        value: "true"

services:
  # Pages, RSS and the public API, proxied to the api over the private network.
  - type: web
    name: ai-pulse-web
    runtime: docker
    plan: starter # 0.5 CPU, 512 MB
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/web/server.ts
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      # Render's proxy records the visitor in X-Forwarded-For.
      - key: TRUST_PROXY
        value: "true"
      # The server reads WEB_HOST and WEB_PORT; PORT only tells Render which port to route to.
      - key: WEB_HOST
        value: 0.0.0.0
      - key: WEB_PORT
        value: "3000"
      - key: PORT
        value: "3000"
      # host:port of the private api; the web adds http://.
      - key: API_BASE_URL
        fromService:
          type: pserv
          name: ai-pulse-api
          property: hostport

  # The backend api, also the one process with the data disk: uploads, the image and share-image caches,
  # feedback screenshots and local backups, and the jobs that read or write them.
  - type: pserv
    name: ai-pulse-api
    runtime: docker
    plan: starter # 512 MB
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/api/src/main.ts
    autoDeployTrigger: checksPass
    preDeployCommand: sh -c "node scripts/migrate.ts && node scripts/seed.ts"
    # A service with a disk stops before its replacement starts: keep the drain short. An interrupted
    # backup or push is failed and retried by its queue.
    maxShutdownDelaySeconds: 45
    disk:
      name: ai-pulse-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - fromGroup: ai-pulse-backend
      - key: DATABASE_URL
        fromDatabase:
          name: ai-pulse-db
          property: connectionString
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: "3001"
      - key: PORT
        value: "3001"
      - key: STOP_TIMEOUT_MS
        value: "30000"
      - key: INGEST_RATE_LIMIT
        value: "10"
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: IMG_PROXY_SIGN_SECRET
        sync: false
      - key: INGEST_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false

  # Collection, model calls, grouping and reports. It has no disk: jobs that touch /data run in the api.
  - type: worker
    name: ai-pulse-worker
    runtime: docker
    plan: standard # 1 CPU, 2 GB
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node apps/worker/src/main.ts
    autoDeployTrigger: checksPass
    # Render's ceiling; the queue drains for STOP_TIMEOUT_MS (270 s), then fails what is left for retry.
    maxShutdownDelaySeconds: 300
    envVars:
      - fromGroup: ai-pulse-backend
      - key: DATABASE_URL
        fromDatabase:
          name: ai-pulse-db
          property: connectionString
      - key: STOP_TIMEOUT_MS
        value: "270000"
      - key: SITE_URL
        sync: false
      - key: IMG_PROXY_SIGN_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false

databases:
  - name: ai-pulse-db
    plan: basic-1gb
    region: oregon
    postgresMajorVersion: "17"
    databaseName: aihot
    user: aihot
    # Only services in this workspace connect.
    ipAllowList: []
