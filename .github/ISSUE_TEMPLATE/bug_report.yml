name: Bug report
description: Report a problem you can reproduce, so it can be found and fixed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Questions about deploying and using the site can go to the [Q&A discussions](https://github.com/KKKKhazix/AIHOT/discussions/categories/q-a) first.
        Report security vulnerabilities through a [private vulnerability report](https://github.com/KKKKhazix/AIHOT/security/advisories/new).
        Do not upload a full .env, API keys, the admin password, cookies or a production database.
  - type: input
    id: revision
    attributes:
      label: Code version
      description: Run git rev-parse --short HEAD in the repository; if unsure, give the date you downloaded or updated it. A repository made with Use this template has commit IDs that do not match this repository, so give the date it was made or last synced with this repository.
      placeholder: Commit ID, or the date of download, creation or sync
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The operating system, Docker or local deployment, and the versions involved; for a web page problem, the browser.
      placeholder: Ubuntu / macOS; Docker Compose / Node.js; behind a reverse proxy or not; related settings changed or not.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Which page, command or action does it start from? Give the fewest steps that reproduce the problem.
      placeholder: |
        1. Open ...
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual result
      placeholder: Expected ...; actual ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Related logs or screenshots (optional)
      description: Paste only the relevant part, and remove keys, passwords, cookies and personal information first. You can submit without logs.
