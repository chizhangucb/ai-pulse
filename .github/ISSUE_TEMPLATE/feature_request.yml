name: Feature request
description: Propose a feature or improvement with a clear use case.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas still being explored can go to the [Ideas discussions](https://github.com/chizhangucb/ai-pulse/discussions/categories/ideas) first.
        This repository does not provide a full list of production sources, and does not maintain dedicated collectors for platforms such as Weibo or Xiaohongshu; see the [sources documentation](https://github.com/chizhangucb/ai-pulse/blob/main/docs/sources.md) to bring in results from an outside collector.
        A feature only your site needs can be built as a module in `modules/` in your own repository; see the [architecture documentation](https://github.com/chizhangucb/ai-pulse/blob/main/docs/architecture.md).
  - type: textarea
    id: problem
    attributes:
      label: Use case and problem
      description: Who needs it, and in what situation? What is inconvenient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior or result you want to see; concrete examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried (optional)
      description: Why do the existing settings, scripts or other approaches not meet the need?
